[req]
distinguished_name = req_distinguished_name
x509_extensions = v3_req
prompt = no

[req_distinguished_name]
CN = 10.253.152.211

[v3_req]
# 1. CRITICAL: Tells ESP32 this is a "Leaf" cert, not a CA
basicConstraints = CA:FALSE

# 2. CRITICAL: 'digitalSignature' is required for modern TLS (ECDHE)
keyUsage = digitalSignature, keyEncipherment

# 3. Explicitly allows Server Authentication
extendedKeyUsage = serverAuth

subjectAltName = @alt_names

[alt_names]
IP.1 = 10.253.152.211    
DNS.1 = mosquitto        
DNS.2 = localhost